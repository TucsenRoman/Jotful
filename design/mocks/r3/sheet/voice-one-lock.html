<link rel="stylesheet" href="sheet.css"><style>
.sheet{left:0;right:0;top:400px;bottom:0;border-radius:38px 38px 0 0;padding:0 20px}
.top{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--grey)}
.dot{width:9px;height:9px;border-radius:5px;background:#FF3B30}
.time{font-size:34px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:2px}
.hint{color:var(--grey);margin-top:2px}
.hint b{color:var(--ink);font-weight:600}
.wave{height:68px;display:flex;align-items:center;gap:3px;margin-top:12px;overflow:hidden}
.wave i{display:block;width:5px;border-radius:3px;background:var(--ink);flex:none}
.wave i:nth-last-child(-n+5){opacity:.25}
.tx{font-size:17px;line-height:23px;margin-top:10px}.tx span{color:var(--grey)}
/* the one button: same spot and size as in peek (60pt, centre 339,789) */
.one{position:absolute;top:359px;left:309px;width:60px;height:60px}
.one .mic{width:60px;height:60px;position:relative;z-index:2}
.one .mic svg{width:26px;height:26px}
.halo{position:absolute;border-radius:50%;background:rgba(2,2,4,.07);z-index:1}
.lk{position:absolute;z-index:3;right:-2px;top:-2px;width:24px;height:24px;border-radius:12px;background:var(--ink);box-shadow:0 0 0 2.5px #fff;display:flex;align-items:center;justify-content:center}
.stopsq{width:20px;height:20px;border-radius:5px;background:#fff}
.tring{position:absolute;inset:-58px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(2,2,4,.22);z-index:0}
.tring.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.grow{position:absolute;border-radius:50%;background:rgba(2,2,4,.10);z-index:1}
.grow.on{background:rgba(2,2,4,.16)}
.fing{position:absolute;z-index:4;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:20px;background:rgba(2,2,4,.10);box-shadow:0 0 0 1.5px rgba(2,2,4,.25)}
.ghost{position:absolute;top:359px;left:309px;width:60px;height:60px;border-radius:30px;box-shadow:inset 0 0 0 1.5px rgba(2,2,4,.12)}
